name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout with FFmpeg submodule
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare build environment
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -InstallDependencies

      - name: Build both architectures
        shell: pwsh
        run: ./scripts/build-all.ps1 -Configuration Release

      - name: Run integration tests
        shell: pwsh
        run: |
          ./scripts/test.ps1 -Arch x86 -Integration
          ./scripts/test.ps1 -Arch x64 -Integration

      - name: Package release and complete source
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          ./scripts/package.ps1 -Version $version

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' release/* `
            --title 'IV50 FFmpeg VFW ${{ github.ref_name }}' `
            --generate-notes `
            --notes 'Experimental unsigned VFW codec. Verify SHA256SUMS.txt before installation.'
